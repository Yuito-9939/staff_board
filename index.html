<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>会場担当 回答ボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header (name + status) / day tabs / two room columns side by side, stacked on phones */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6; --ink:#192033; --muted:#5a6579; --line:#d9dee7;
  --r1:#2d4ea2; --r1-soft:#e4eafa; --r2:#0e766f; --r2-soft:#dcf1ee;
  --warn:#b4400b; --warn-soft:#fdeadd; --ok:#17653a; --ok-soft:#dff3e6; --focus:#1d4ed8;
  --f-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141d; --surface:#181e2b; --surface-2:#212839; --ink:#e8ecf4; --muted:#9aa5ba; --line:#2d3649;
    --r1:#8fa8f0; --r1-soft:#1f2a4d; --r2:#59cfc4; --r2-soft:#12332f;
    --warn:#ffa670; --warn-soft:#3c2414; --ok:#7fdca2; --ok-soft:#173424; --focus:#8fb0ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141d; --surface:#181e2b; --surface-2:#212839; --ink:#e8ecf4; --muted:#9aa5ba; --line:#2d3649;
  --r1:#8fa8f0; --r1-soft:#1f2a4d; --r2:#59cfc4; --r2-soft:#12332f;
  --warn:#ffa670; --warn-soft:#3c2414; --ok:#7fdca2; --ok-soft:#173424; --focus:#8fb0ff; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.head-in{max-width:1080px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.brand{min-width:0}
.brand h1{font:900 19px/1.3 var(--f-display);margin:0;letter-spacing:.02em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.me{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.me label{font-size:12.5px;color:var(--muted);font-weight:700}
.me input{font:inherit;width:11.5em;max-width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.me button{font:700 13px var(--f-body);padding:7px 12px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.status{font:500 12px var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live .dot{background:var(--ok)} .status.bad .dot{background:var(--warn)}
nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:9px 14px 10px;border-bottom:3px solid transparent;font:700 14px var(--f-display);white-space:nowrap}
nav a small{display:block;font:400 11px var(--f-mono);letter-spacing:.02em}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}

main{padding-top:20px}
.notice{padding:12px 14px;border-radius:8px;margin:0 0 16px;font-size:14px;border:1px solid var(--line);background:var(--surface-2)}
.notice.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.notice strong{font-family:var(--f-display)}
.daybar{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:14px}
.daybar h2{font:900 22px/1.3 var(--f-display);margin:0}
.daybar .count{font:500 13px var(--f-mono);color:var(--muted)}
.count b{color:var(--warn);font-weight:500}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:820px){.rooms{grid-template-columns:minmax(0,1fr)}}
.room{--rc:var(--r1);--rs:var(--r1-soft);min-width:0}
.room.r2{--rc:var(--r2);--rs:var(--r2-soft)}
.room h3{margin:0 0 10px;padding:8px 12px;background:var(--rs);color:var(--rc);border-radius:6px;font:900 16px/1.4 var(--f-display);display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px}
.room h3 span{font:500 12px var(--f-mono);align-self:center}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.mine{border-color:var(--rc);box-shadow:0 0 0 1px var(--rc)}
.card .row1{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px}
.time{font:500 14px var(--f-mono);color:var(--rc);font-variant-numeric:tabular-nums}
.pill{font:700 11.5px var(--f-body);padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.none{background:var(--warn-soft);color:var(--warn)}
.pill.some{background:var(--ok-soft);color:var(--ok)}
.card h4{margin:0;font:700 16px/1.45 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.sub{margin:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.org{font-size:12px;color:var(--muted);font-weight:700}
.people{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;align-items:center}
.chip{padding:2px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;max-width:100%;overflow-wrap:anywhere}
.chip.me{background:var(--rs);border-color:var(--rc);color:var(--rc);font-weight:700}
.plist{display:flex;flex-direction:column;gap:6px;min-height:28px;justify-content:center}
.pl{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.cm{font-size:13px;min-width:0;overflow-wrap:anywhere}
.cmform{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cml{font-size:12.5px;color:var(--muted);font-weight:700}
.cmform input{flex:1 1 11em;min-width:0;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.cmform .save{font:700 13px var(--f-body);padding:7px 14px;border-radius:6px;border:1px solid var(--rc);background:var(--rc);color:var(--surface);cursor:pointer}
.cmform .save[disabled]{opacity:.55}
.empty-line{color:var(--muted);font-size:13px}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button.join{font:700 14px var(--f-body);padding:9px 16px;border-radius:6px;cursor:pointer;border:1.5px solid var(--rc);background:transparent;color:var(--rc);min-height:40px}
button.join:hover{background:var(--rs)}
button.join.on{background:var(--rc);color:var(--surface)}
button.join.on:hover{opacity:.9}
button.join[disabled]{opacity:.55;cursor:wait}
.conflict{font-size:12.5px;color:var(--warn);font-weight:700}

.tag1{color:var(--r1);font-weight:700}.tag2{color:var(--r2);font-weight:700}
.roster{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.roster .chip b{font:500 12px var(--f-mono);color:var(--muted);margin-left:4px;font-weight:500}
.hint{margin:0 0 18px;color:var(--muted);font-size:13px}
.sched{margin-bottom:30px}
.banner{background:var(--ink);color:var(--bg);border-radius:6px 6px 0 0;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px}
.banner h2{margin:0;font:900 20px var(--f-display);letter-spacing:.35em}
.banner span{font:500 14px var(--f-display)}
.tt{display:grid;grid-template-columns:3.2rem minmax(0,1fr) minmax(0,1fr);background:var(--surface-2);border:1px solid var(--line);border-top:0}
.colh{background:var(--surface);padding:6px 8px;text-align:center;font:700 14px var(--f-display);border-bottom:1px solid var(--line);grid-row:1;min-width:0}
.colh+.colh{border-left:1px solid var(--line)}
.colh small{display:block;font:400 11px var(--f-body);color:var(--muted)}
.colh.c1{color:var(--r1)}.colh.c2{color:var(--r2)}
.hl{grid-column:1/-1;border-top:1px dotted var(--line);pointer-events:none}
.tl{grid-column:1;font:500 11px var(--f-mono);color:var(--muted);padding:2px 4px;font-variant-numeric:tabular-nums}
.tl.end{align-self:end}
.blk{--rc:var(--r1);--rs:var(--r1-soft);margin:3px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 7px;min-width:0;display:flex;flex-direction:column;gap:4px;position:relative;z-index:1}
.blk.c2{--rc:var(--r2);--rs:var(--r2-soft)}
.blk .bt{font:500 11.5px var(--f-mono);color:var(--rc);text-align:center;font-variant-numeric:tabular-nums}
.blk .bh{background:var(--surface-2);border-radius:4px;padding:3px 6px;font:700 13px/1.4 var(--f-display);text-align:center;overflow-wrap:anywhere}
.blk .bs{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.45;overflow-wrap:anywhere}
.blk .bo{font-size:11px;font-weight:700;text-align:center;color:var(--muted)}
.blk .bn{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:auto;padding-top:2px}
.blk .chip{font-size:12.5px;padding:1px 9px}
.blk .pn{display:flex;flex-direction:column;align-items:center;gap:1px;max-width:100%;min-width:0}
.blk .cm{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.4}
@media (max-width:520px){.tt{grid-template-columns:2.6rem minmax(0,1fr) minmax(0,1fr)}.blk{padding:5px}.blk .bh{font-size:12px}.blk .chip{font-size:12px;padding:1px 7px}.banner h2{letter-spacing:.2em}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="head-in">
      <div class="top">
        <div class="brand">
          <h1>第1・第2会場 運営スタッフ担当ボード</h1>
          <p>岡山コンベンションセンター ／ 11月20日(金)〜22日(日)</p>
        </div>
        <div class="me">
          <label for="nameInput">あなたの名前</label>
          <input id="nameInput" type="text" maxlength="20" placeholder="例：山田" autocomplete="off">
          <button id="nameSave" type="button">決定</button>
        </div>
      </div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">接続中…</span></div>
      <nav id="tabs" aria-label="日程"></nav>
    </div>
  </header>
  <main id="app"></main>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
  // [id, day, room, start, end, title, subtitle, sponsor, note]
  var P = [
    ["d1r1-0820",1,1,"8:20","8:30","開会式","","",""],
    ["d1r1-0830",1,1,"8:30","10:00","シンポジウム1","身体障害・自立支援医療の認定基準について","",""],
    ["d1r1-1030",1,1,"10:30","11:30","Plenary Lecture 1","HIV Prevention: No Time to Lose","","オンデマンド配信・自動翻訳あり"],
    ["d1r1-1140",1,1,"11:40","12:40","ランチョンセミナー1","HIV治療の新たな潮流 〜2DRの可能性とPLHIVを中心とした医療の未来〜","共催：ヴィーブヘルスケア株式会社",""],
    ["d1r1-1250",1,1,"12:50","14:20","シンポジウム4","次世代抗HIV薬の最新知見","",""],
    ["d1r1-1430",1,1,"14:30","16:00","日本性感染症学会 合同シンポジウム","DOXY-PEP の Pros and Cons：性感染症予防と AMR","",""],
    ["d1r2-0830",1,2,"8:30","10:00","シンポジウム2","『見えない存在』から『知ってもらう社会』へ —HIV/AIDS差別ゼロに向け当事者はどこまでかかわるべきか？—","",""],
    ["d1r2-1140",1,2,"11:40","12:40","ランチョンセミナー2","","共催：ギリアド・サイエンシズ株式会社",""],
    ["d1r2-1250",1,2,"12:50","14:20","シンポジウム5","高齢化に関する横断的シンポジウム","","「認定講習会・薬剤師」としても申請可能"],
    ["d1r2-1430",1,2,"14:30","16:30","シンポジウム7","越境する免疫学：感染免疫と腫瘍免疫から学ぶ次世代HIV治療戦略","",""],

    ["d2r1-0830",2,1,"8:30","10:00","シンポジウム8　日本エイズ学会認定講習会（医師）","日和見感染症、合併症","","オンデマンド配信あり"],
    ["d2r1-1010",2,1,"10:10","11:10","Plenary Lecture 2","Challenges in Late diagnosis of HIV","","オンデマンド配信・自動翻訳あり"],
    ["d2r1-1130",2,1,"11:30","12:30","ランチョンセミナー4","日本における新規の抗HIV薬『イドビンソ®配合錠』の位置づけ","共催：MSD株式会社",""],
    ["d2r1-1240",2,1,"12:40","13:40","代議員総会・会員総会・評議員総会","優秀演題賞 表彰式","",""],
    ["d2r1-1340",2,1,"13:40","14:10","学会賞受賞講演","","","オンデマンド配信あり"],
    ["d2r1-1410",2,1,"14:10","14:25","会長講演","","","オンデマンド配信あり"],
    ["d2r1-1440",2,1,"14:40","16:40","シンポジウム11","HIVスクリーニング検査のいろいろな姿","",""],
    ["d2r1-1650",2,1,"16:50","18:50","共催シンポジウム5","ARTのゴールをどこに置くか？HIV陽性者のWell-beingと、日々の治療との向き合い方から見えてくるもの","共催：ヴィーブヘルスケア株式会社",""],
    ["d2r2-0830",2,2,"8:30","10:30","シンポジウム9","在日外国人の動向把握と予防啓発・検査・治療支援をつなぐ","",""],
    ["d2r2-1130",2,2,"11:30","12:30","ランチョンセミナー5","〜長期療養について考える〜未来の連携のあり方 つなぐのは誰か〜","共催：セコム医療システム株式会社",""],
    ["d2r2-1440",2,2,"14:40","16:40","共催シンポジウム4","日常診療におけるHIV治療の再設計 －長期的成功を見据えた臨床と対話の統合－","共催：ギリアド・サイエンシズ株式会社",""],
    ["d2r2-1650",2,2,"16:50","18:20","共催シンポジウム6","ART選択肢の拡大がもたらすHBVマネジメント変革の必要性","共催：MSD株式会社",""],

    ["d3r1-0830",3,1,"8:30","10:30","Scientific Engagement Satellite Symposium","HIV診療におけるB型肝炎ウイルス対策の現在地と未来展望 〜個別化医療時代に求められるHBVマネジメント〜","共催：ヴィーブヘルスケア株式会社",""],
    ["d3r1-1040",3,1,"10:40","12:10","シンポジウム15","ARTの変化と薬剤マネジメント","","「認定講習会・薬剤師」としても申請可能"],
    ["d3r1-1230",3,1,"12:30","13:30","ランチョンセミナー7","","共催：ギリアド・サイエンシズ株式会社",""],
    ["d3r1-1340",3,1,"13:40","15:40","シンポジウム（治療の手引き）","","","認定講習会（医師・看護師・薬剤師）／オンデマンド配信あり"],
    ["d3r1-1550",3,1,"15:50","17:00","大会総括プログラム","つどう。つながる。多様な力を未来につむぐ。","","オンデマンド配信あり"],
    ["d3r1-1700",3,1,"17:00","17:10","閉会式","","",""],
    ["d3r2-0830",3,2,"8:30","10:30","シンポジウム13","2030年エイズ流行終結に向けた予防啓発とCBOの役割 ―「予防の医療化」の時代にCBOは何を担い、何を必要とするか―","",""],
    ["d3r2-1040",3,2,"10:40","12:10","シンポジウム16","PrEPに関しての横断的シンポジウム","",""],
    ["d3r2-1230",3,2,"12:30","13:30","ランチョンセミナー8","薬害患者さんの高齢化に伴う血友病診療と包括的ケア","共催：サノフィ株式会社",""],
    ["d3r2-1340",3,2,"13:40","15:40","シンポジウム（治療の手引き）","","","第1会場の中継"]
  ].map(function(a){return {id:a[0],day:a[1],room:a[2],s:a[3],e:a[4],title:a[5],sub:a[6],org:a[7],note:a[8],sm:mins(a[3]),em:mins(a[4])}});
  var DAYS = {1:"11月20日(金)",2:"11月21日(土)",3:"11月22日(日)"};
  var ROOMS = {1:["第1会場","3F コンベンションホール"],2:["第2会場","1F イベントホール"]};
  var BYID = {}; P.forEach(function(p){BYID[p.id]=p});

  function mins(t){var x=t.split(":");return (+x[0])*60+(+x[1])}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function normName(n){return String(n||"").normalize("NFKC").replace(/\s+/g," ").trim().slice(0,20)}
  function hex(s){return Array.from(new TextEncoder().encode(s.toLowerCase())).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
  function docId(p,name){return p+"__"+hex(name)}
  function sameName(a,b){return a.toLowerCase()===b.toLowerCase()}

  var drafts={}, db=null, entries=[], loaded=false, pending={}, myName="", view="day1";
  try{myName=normName(localStorage.getItem("staffName")||"")}catch(e){}

  var $app=document.getElementById("app"), $tabs=document.getElementById("tabs"), $in=document.getElementById("nameInput"),
      $st=document.getElementById("status"), $stt=document.getElementById("statusText"), $toast=document.getElementById("toast");
  $in.value=myName;

  function toast(msg){
    $toast.textContent=msg;$toast.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){$toast.hidden=true},4500);
  }
  function setStatus(kind,text){$st.className="status "+kind;$stt.textContent=text}

  function saveName(){
    var n=normName($in.value);
    if(!n){toast("名前を入力してください");$in.focus();return}
    myName=n;$in.value=n;
    try{localStorage.setItem("staffName",n)}catch(e){}
    toast("「"+n+"」として回答します");
    render();
  }
  document.getElementById("nameSave").addEventListener("click",saveName);
  $in.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();saveName()}});

  function byProg(){
    var m={};entries.forEach(function(en){(m[en.p]=m[en.p]||[]).push(en)});
    Object.keys(m).forEach(function(k){m[k].sort(function(a,b){return (a.t||0)-(b.t||0)})});
    return m;
  }
  function isMine(en){return myName && sameName(en.name,myName)}

  function conflictsFor(prog,m){
    if(!myName) return false;
    var mine=P.filter(function(q){return q.day===prog.day && q.id!==prog.id && (m[q.id]||[]).some(isMine)});
    return mine.some(function(q){return q.sm<prog.em && prog.sm<q.em});
  }

  function renderTabs(){
    var items=[["day1","1日目","11/20(金)"],["day2","2日目","11/21(土)"],["day3","3日目","11/22(日)"],["people","全体一覧","時間割で確認"]];
    $tabs.innerHTML=items.map(function(t){
      return '<a href="#'+t[0]+'"'+(view===t[0]?' aria-current="page"':'')+'>'+t[1]+'<small>'+t[2]+'</small></a>';
    }).join("");
  }

  function cardHtml(p,m){
    var list=m[p.id]||[], mine=list.some(isMine), busy=!!pending[p.id];
    var chips=list.length?list.map(function(en){return '<div class="pl"><span class="chip'+(isMine(en)?' me':'')+'">'+esc(en.name)+'</span>'+(en.c?'<span class="cm">'+esc(en.c)+'</span>':'')+'</div>'}).join(""):'<span class="empty-line">まだ誰も回答していません</span>';
    var my=list.filter(isMine)[0], form='';
    if(my){
      var val=drafts.hasOwnProperty(p.id)?drafts[p.id]:my.c;
      form='<div class="cmform"><label class="cml" for="cm-'+p.id+'">コメント</label><input id="cm-'+p.id+'" data-cm="'+p.id+'" type="text" maxlength="80" placeholder="例：10時から参加できます" value="'+esc(val)+'" autocomplete="off">'+
        '<button type="button" class="save" data-act="savecm" data-p="'+p.id+'"'+(pending["c"+p.id]?' disabled':'')+'>保存</button></div>';
    }
    var conf=mine && conflictsFor(p,m);
    return '<article class="card'+(mine?' mine':'')+'">'+
      '<div class="row1"><span class="time">'+p.s+'–'+p.e+'</span>'+
      '<span class="pill '+(list.length?'some':'none')+'">'+(list.length?list.length+'名 対応可能':'担当なし')+'</span></div>'+
      '<h4>'+esc(p.title)+'</h4>'+
      (p.sub?'<p class="sub">'+esc(p.sub)+'</p>':'')+
      (p.org?'<div class="org">'+esc(p.org)+'</div>':'')+
      (p.note?'<p class="sub">'+esc(p.note)+'</p>':'')+
      '<div class="plist" aria-label="対応可能なスタッフ">'+chips+'</div>'+form+
      '<div class="act"><button type="button" class="join'+(mine?' on':'')+'" data-act="toggle" data-p="'+p.id+'"'+(busy?' disabled':'')+'>'+
      (mine?'✓ 対応可能（タップで取り消し）':'対応できる')+'</button>'+
      (conf?'<span class="conflict">同じ時間帯に別のプログラムも選択中です</span>':'')+'</div>'+
      '</article>';
  }

  function renderDay(d){
    var m=byProg(), list=P.filter(function(p){return p.day===d});
    var none=list.filter(function(p){return !(m[p.id]||[]).length}).length;
    var html='';
    if(!myName) html+='<div class="notice warn"><strong>最初に名前を入力してください。</strong> 画面上の「あなたの名前」に入力して「決定」を押すと、各プログラムの「対応できる」ボタンが使えます。</div>';
    html+='<div class="daybar"><h2>'+DAYS[d]+'</h2><span class="count">担当なし <b>'+none+'</b> ／ 全'+list.length+'プログラム</span></div><div class="rooms">';
    [1,2].forEach(function(r){
      var rl=list.filter(function(p){return p.room===r}).sort(function(a,b){return a.sm-b.sm});
      html+='<section class="room r'+r+'"><h3>'+ROOMS[r][0]+'<span>'+ROOMS[r][1]+'</span></h3><div class="list">'+
        rl.map(function(p){return cardHtml(p,m)}).join("")+'</div></section>';
    });
    html+='</div>';
    $app.innerHTML=html;
  }

  function fmt(m){return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")}
  function schedHtml(d,m){
    var list=P.filter(function(p){return p.day===d}),ts={};
    list.forEach(function(p){ts[p.sm]=1;ts[p.em]=1});
    var times=Object.keys(ts).map(Number).sort(function(a,b){return a-b}),idx={};
    times.forEach(function(t,i){idx[t]=i});
    var n=times.length-1;
    var h='<section class="sched"><div class="banner"><h2>日 程 表</h2><span>'+d+'日目・'+DAYS[d]+'</span></div><div class="tt">'+
      '<div class="colh" style="grid-column:1">時間</div>'+
      [1,2].map(function(r){return '<div class="colh c'+r+'" style="grid-column:'+(r+1)+'">'+ROOMS[r][0]+'<small>'+ROOMS[r][1]+'</small></div>'}).join("");
    for(var i=0;i<n;i++){
      h+='<div class="hl" style="grid-row:'+(i+2)+'"></div><div class="tl" style="grid-row:'+(i+2)+'">'+fmt(times[i])+'</div>';
    }
    h+='<div class="tl end" style="grid-row:'+(n+1)+'">'+fmt(times[n])+'</div>';
    list.forEach(function(p){
      var names=m[p.id]||[];
      h+='<div class="blk c'+p.room+'" style="grid-column:'+(p.room+1)+';grid-row:'+(idx[p.sm]+2)+'/'+(idx[p.em]+2)+'">'+
        '<div class="bt">'+p.s+' 〜 '+p.e+'</div><div class="bh">'+esc(p.title)+'</div>'+
        (p.sub?'<div class="bs">'+esc(p.sub)+'</div>':'')+
        (p.org?'<div class="bo">'+esc(p.org)+'</div>':'')+
        '<div class="bn">'+(names.length?names.map(function(en){return '<div class="pn"><span class="chip'+(isMine(en)?' me':'')+'">'+esc(en.name)+'</span>'+(en.c?'<span class="cm">'+esc(en.c)+'</span>':'')+'</div>'}).join(""):'<span class="pill none">担当なし</span>')+'</div></div>';
    });
    return h+'</div></section>';
  }

  function renderPeople(){
    var m=byProg(),people={};
    entries.forEach(function(en){if(!BYID[en.p])return;var k=en.name.toLowerCase();(people[k]=people[k]||{name:en.name,n:0}).n++});
    var arr=Object.keys(people).map(function(k){return people[k]}).sort(function(a,b){return a.name.localeCompare(b.name,"ja")});
    var none=P.filter(function(p){return !(m[p.id]||[]).length}).length;
    var html='<div class="daybar"><h2>全体一覧</h2><span class="count">回答者 '+arr.length+'名 ／ 担当なし <b>'+none+'</b> ／ 全'+P.length+'プログラム</span></div>'+
      '<div class="roster">'+(arr.length?arr.map(function(pr){return '<span class="chip'+(myName&&sameName(pr.name,myName)?' me':'')+'">'+esc(pr.name)+'<b>'+pr.n+'件</b></span>'}).join(""):'<span class="empty-line">まだ回答がありません</span>')+'</div>'+
      '<p class="hint">回答の追加・取り消しは、1日目〜3日目のタブで「対応できる」を押して行います。</p>';
    [1,2,3].forEach(function(d){html+=schedHtml(d,m)});
    $app.innerHTML=html;
  }

  function render(){
    var ae=document.activeElement, fid=(ae&&ae.getAttribute&&ae.getAttribute("data-cm"))?ae.id:null, ss=fid?ae.selectionStart:0;
    renderTabs();
    if(view==="people") renderPeople();
    else renderDay(+view.slice(3));
    if(fid){var el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(ss,ss)}catch(e){}}}
  }

  function route(){
    var h=(location.hash||"").slice(1);
    view=["day1","day2","day3","people"].indexOf(h)>=0?h:"day1";
    render();window.scrollTo(0,0);
  }
  window.addEventListener("hashchange",route);

  function errMsg(e){
    var c=e&&e.code;
    if(c==="invalid_argument") return "書き込めませんでした。データベースのルール設定を確認してください。";
    if(c==="quota_exceeded") return "保存できる上限に達しました。管理者に連絡してください。";
    return "保存できませんでした。通信状況を確認して、もう一度お試しください。";
  }

  async function setMine(pid,on){
    if(!myName){toast("先に名前を入力して「決定」を押してください");$in.focus();return}
    if(!db){toast("共有データに接続できていません");return}
    if(pending[pid]) return;
    pending[pid]=1;render();
    try{
      var ref=db.doc("signups/"+docId(pid,myName));
      if(on) await ref.set({p:pid,name:myName,t:Date.now()});
      else await ref.delete();
    }catch(e){toast(errMsg(e))}
    delete pending[pid];render();
  }

  async function saveComment(pid){
    if(!db||!myName||pending["c"+pid]) return;
    var my=(byProg()[pid]||[]).filter(isMine)[0];
    if(!my){toast("先に「対応できる」を押してください");return}
    var text=(drafts.hasOwnProperty(pid)?drafts[pid]:my.c).replace(/\s+/g," ").trim().slice(0,80);
    pending["c"+pid]=1;render();
    try{
      await db.doc("signups/"+docId(pid,myName)).set({p:pid,name:myName,t:my.t||Date.now(),c:text});
      delete drafts[pid];toast(text?"コメントを保存しました":"コメントを削除しました");
    }catch(e){toast(errMsg(e))}
    delete pending["c"+pid];render();
  }
  $app.addEventListener("input",function(ev){
    var t=ev.target;if(t&&t.getAttribute&&t.getAttribute("data-cm")) drafts[t.getAttribute("data-cm")]=t.value;
  });
  $app.addEventListener("keydown",function(ev){
    var t=ev.target;if(ev.key==="Enter"&&t&&t.getAttribute&&t.getAttribute("data-cm")){ev.preventDefault();saveComment(t.getAttribute("data-cm"))}
  });
  $app.addEventListener("click",function(ev){
    var b=ev.target.closest("button[data-act]");if(!b) return;
    var pid=b.getAttribute("data-p"),act=b.getAttribute("data-act");
    if(act==="savecm") saveComment(pid);
    else if(act==="remove") setMine(pid,false);
    else{
      var m=byProg(),mine=(m[pid]||[]).some(isMine);
      if(mine) delete drafts[pid];
      setMine(pid,!mine);
    }
  });

  // Supabase の Project URL と anon（publishable）key。service_role key は絶対に入れないこと
  var SUPABASE_URL="PASTE_SUPABASE_URL_HERE"; // 例: https://xxxxxxxxxxxx.supabase.co
  var SUPABASE_KEY="PASTE_SUPABASE_ANON_KEY_HERE";
  var TABLE="staff_board_signups";
  async function start(){
    if(!/^https:\/\/[^ ]+$/.test(SUPABASE_URL)||/^PASTE_/.test(SUPABASE_KEY)){setStatus("bad","データベースが未設定です");render();return}
    var base=SUPABASE_URL.replace(/\/+$/,"")+"/rest/v1/"+TABLE, last="";
    var hdr={"apikey":SUPABASE_KEY,"Content-Type":"application/json"};
    if(/^eyJ/.test(SUPABASE_KEY)) hdr.Authorization="Bearer "+SUPABASE_KEY; // 旧形式（JWT）の anon key
    async function call(method,query,body,prefer){
      var h=Object.assign({},hdr);if(prefer) h.Prefer=prefer;
      var r=await fetch(base+query,{method:method,headers:h,cache:"no-store",body:body===undefined?undefined:JSON.stringify(body)});
      if(!r.ok){var e=new Error("http "+r.status);e.code=(r.status===401||r.status===403||r.status===400)?"invalid_argument":"unavailable";throw e}
      return r.status===204?null:r.json();
    }
    async function poll(){
      try{
        var rows=(await call("GET","?select=id,p,name,t,c&order=t.asc"))||[];
        var str=JSON.stringify(rows);
        loaded=true;setStatus("live","共有中・数秒ごとに自動更新");
        if(str===last) return;
        last=str;
        entries=rows.map(function(x){return {id:x.id,p:x.p,name:String(x.name||""),t:+x.t||0,c:String(x.c||"")}}).filter(function(x){return x.p&&x.name});
        render();
      }catch(e){setStatus("bad","共有データを読み込めません")}
    }
    db={doc:function(path){var id=path.split("/").pop();return {
      set:function(d){return call("POST","?on_conflict=id",{id:id,p:d.p,name:d.name,t:d.t,c:d.c||""},"resolution=merge-duplicates,return=minimal").then(poll)},
      delete:function(){return call("DELETE","?id=eq."+encodeURIComponent(id),undefined,"return=minimal").then(poll)}
    }}};
    setStatus("","接続中…");
    setTimeout(function(){if(!loaded) setStatus("bad","読み込みに時間がかかっています")},10000);
    await poll();
    setInterval(function(){if(!document.hidden) poll()},4000);
  }

  route();
  start();
})();
</script>
</body>
</html>
