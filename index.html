<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>会場担当 回答ボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header (name + status) / day tabs / two room columns side by side, stacked on phones */
/* 端末のダークモードに関係なく常に白背景。文字はすべて白地でコントラスト比 4.5:1 以上。
   会場の色は色覚の違いでも見分けやすい「青」と「オレンジ」の組み合わせ */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f1f3f6; --ink:#111111; --muted:#444b57; --line:#a3abb7;
  --r1:#1a4fb5; --r1-soft:#e3ebfb; --r2:#a14a00; --r2-soft:#fdebd9;
  --warn:#c0001b; --warn-soft:#fde4e6; --ok:#17653a; --ok-soft:#dcf2e3; --focus:#1a4fb5;
  --f-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.head-in{max-width:1080px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.brand{min-width:0}
.brand h1{font:900 20px/1.35 var(--f-display);margin:0;letter-spacing:.02em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:14px}
.me{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.me label{font-size:14px;color:var(--muted);font-weight:700}
.me input{font:inherit;width:11.5em;max-width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.me button{font:700 15px var(--f-body);padding:8px 16px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.status{font:700 13px var(--f-body);color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live .dot{background:var(--ok)} .status.bad .dot{background:var(--warn)}
nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:9px 14px 10px;border-bottom:4px solid transparent;font:700 15px var(--f-display);white-space:nowrap}
nav a small{display:block;font:400 12.5px var(--f-mono);letter-spacing:.02em}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
@media (max-width:420px){nav a{padding:9px 8px 10px}}

main{padding-top:20px}
.notice{padding:12px 14px;border-radius:8px;margin:0 0 16px;font-size:14px;border:1px solid var(--line);background:var(--surface-2)}
.notice.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.notice strong{font-family:var(--f-display)}
.daybar{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:14px}
.daybar h2{font:900 22px/1.3 var(--f-display);margin:0}
.daybar .count{font:700 14px var(--f-body);color:var(--muted)}
.count b{color:var(--warn);font-weight:500}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:820px){.rooms{grid-template-columns:minmax(0,1fr)}}
.room{--rc:var(--r1);--rs:var(--r1-soft);min-width:0}
.room.r2{--rc:var(--r2);--rs:var(--r2-soft)}
.room h3{margin:0 0 10px;padding:8px 12px;background:var(--rs);color:var(--rc);border-radius:6px;font:900 16px/1.4 var(--f-display);display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px}
.room h3 span{font:700 13px var(--f-body);align-self:center}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.mine{border-color:var(--rc);box-shadow:0 0 0 2px var(--rc);background:var(--rs)}
.card .row1{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px}
.time{font:500 16px var(--f-mono);color:var(--rc);font-variant-numeric:tabular-nums}
.pill{font:700 13px var(--f-body);padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill.none{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.pill.some{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.card h4{margin:0;font:700 17px/1.45 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.sub{margin:0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.org{font-size:13.5px;color:var(--muted);font-weight:700}
.people{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;align-items:center}
.chip{padding:2px 11px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:14.5px;max-width:100%;overflow-wrap:anywhere}
.chip.me{background:var(--rs);border-color:var(--rc);color:var(--rc);font-weight:700}
.plist{display:flex;flex-direction:column;gap:6px;min-height:28px;justify-content:center}
.pl{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.cm{font-size:14px;min-width:0;overflow-wrap:anywhere}
.cmform{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cml{font-size:14px;color:var(--muted);font-weight:700}
.cmform input{flex:1 1 11em;min-width:0;font:inherit;font-size:16px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.cmform .save{font:700 15px var(--f-body);padding:8px 16px;border-radius:6px;border:1px solid var(--rc);background:var(--rc);color:var(--surface);cursor:pointer}
.cmform .save[disabled]{opacity:.55}
.empty-line{color:var(--muted);font-size:14px}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button.join{font:700 16px var(--f-body);padding:10px 18px;border-radius:8px;cursor:pointer;border:2px solid var(--rc);background:var(--surface);color:var(--rc);min-height:48px}
button.join:hover{background:var(--rs)}
button.join.on{background:var(--rc);color:var(--surface)}
button.join.on:hover{opacity:.9}
button.join[disabled]{opacity:.55;cursor:wait}
.conflict{font-size:14px;color:var(--warn);font-weight:700}

.tag1{color:var(--r1);font-weight:700}.tag2{color:var(--r2);font-weight:700}
.roster{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.roster .chip b{font:500 13px var(--f-mono);color:var(--muted);margin-left:4px;font-weight:500}
.hint{margin:0 0 18px;color:var(--muted);font-size:14px}
.sched{margin-bottom:30px}
.banner{background:var(--ink);color:var(--bg);border-radius:6px 6px 0 0;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px}
.banner h2{margin:0;font:900 20px var(--f-display);letter-spacing:.35em}
.banner span{font:500 14px var(--f-display)}
.tt{display:grid;grid-template-columns:3.2rem minmax(0,1fr) minmax(0,1fr);background:var(--surface-2);border:1px solid var(--line);border-top:0}
.colh{background:var(--surface);padding:6px 8px;text-align:center;font:700 14px var(--f-display);border-bottom:1px solid var(--line);grid-row:1;min-width:0}
.colh+.colh{border-left:1px solid var(--line)}
.colh small{display:block;font:400 12.5px var(--f-body);color:var(--muted)}
.colh.c1{color:var(--r1)}.colh.c2{color:var(--r2)}
.hl{grid-column:1/-1;border-top:1px dotted var(--line);pointer-events:none}
.tl{grid-column:1;font:500 12.5px var(--f-mono);color:var(--muted);padding:2px 4px;font-variant-numeric:tabular-nums}
.tl.end{align-self:end}
.blk{--rc:var(--r1);--rs:var(--r1-soft);margin:3px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 7px;min-width:0;display:flex;flex-direction:column;gap:4px;position:relative;z-index:1}
.blk.c2{--rc:var(--r2);--rs:var(--r2-soft)}
.blk .bt{font:500 12.5px var(--f-mono);color:var(--rc);text-align:center;font-variant-numeric:tabular-nums}
.blk .bh{background:var(--surface-2);border-radius:4px;padding:3px 6px;font:700 13px/1.4 var(--f-display);text-align:center;overflow-wrap:anywhere}
.blk .bs{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.45;overflow-wrap:anywhere}
.blk .bo{font-size:12.5px;font-weight:700;text-align:center;color:var(--muted)}
.blk .bn{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:auto;padding-top:2px}
.blk .chip{font-size:13.5px;padding:1px 9px}
.blk .pn{display:flex;flex-direction:column;align-items:center;gap:1px;max-width:100%;min-width:0}
.blk .cm{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.4}
@media (max-width:520px){.tt{grid-template-columns:2.9rem minmax(0,1fr) minmax(0,1fr)}.blk{padding:5px}.blk .bh{font-size:13px}.blk .chip{font-size:13px;padding:1px 7px}.banner h2{letter-spacing:.2em}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;font-size:16px;z-index:40;box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

/* 管理者モード（?admin=合言葉 で開いた時だけ表示される部品） */
.adminbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;font:700 14px var(--f-body);color:var(--warn)}
.adminbar button{font:700 13px var(--f-body);padding:4px 12px;border-radius:6px;border:1.5px solid var(--warn);background:var(--surface);color:var(--warn);cursor:pointer}
.adm{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.mini{font:700 13px var(--f-body);padding:4px 10px;min-height:34px;border-radius:6px;border:1.5px solid var(--muted);background:var(--surface);color:var(--ink);cursor:pointer}
.mini.del{border-color:var(--warn);color:var(--warn)}
.mini.pick{border-color:var(--ok);color:var(--ok)}
.mini.pick.on{background:var(--ok);color:#fff}
.mini[disabled],.btn[disabled]{opacity:.55;cursor:wait}
.edrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.edrow input{flex:1 1 8em;min-width:0;font:inherit;font-size:16px;padding:6px 8px;border:1.5px solid var(--ok);border-radius:6px;background:var(--bg);color:var(--ink)}
.decide{border-top:1.5px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.decide .lbl{font:700 14px var(--f-body);color:var(--ok)}
.decide .cmform .save{background:var(--ok);border-color:var(--ok)}
.chip.fin{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.chip .x{border:0;background:none;color:inherit;font:700 15px var(--f-body);cursor:pointer;padding:0 2px 0 6px}
.ctl{background:var(--surface-2);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.ctl .st{flex:1 1 14em;font-size:14px;color:var(--muted)}
.ctl .st strong{display:block;font:900 17px var(--f-display);color:var(--ink)}
.btn{font:700 15px var(--f-body);padding:9px 18px;min-height:46px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink)}
.notice a{color:var(--r1);font-weight:700}
.mylist{background:var(--ok-soft);border:1.5px solid var(--ok);border-radius:8px;padding:12px 14px;margin:0 0 16px}
.mylist h3{margin:0 0 6px;font:900 16px var(--f-display);color:var(--ok)}
.mylist ul{margin:0;padding-left:1.2em}
.mylist li{margin:2px 0}
.everyone{margin:0 0 24px}
.everyone h3{margin:0 0 8px;font:900 18px var(--f-display)}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19em),1fr));gap:8px}
.ev{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.ev-name{font:700 16px var(--f-display);display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px}
.ev-name span{font:700 13px var(--f-body);color:var(--muted)}
.ev ul{margin:0;padding:0;list-style:none}
.ev li{font-size:14px;line-height:1.5;overflow-wrap:anywhere;padding:1px 0}
.ev li b{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
@page{size:A4 portrait;margin:10mm}
@media print{
  header,body::before,.noprint,.mylist,.notice,#toast{display:none!important}
  body{padding:0;font-size:13px}
  main{padding-top:0}
  .daybar{margin-bottom:6px}
  .roster{margin-bottom:10px}
  .sched{margin-bottom:0;break-before:page}
  /* 印刷した人の名前だけ目立たないよう、全員を同じ見た目にする */
  .chip.me{background:var(--surface-2);border-color:var(--line);color:var(--ink);font-weight:400}
  .everyone h3{font-size:15px;margin-bottom:6px}
  .ev-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .ev{padding:4px 8px;break-inside:avoid}
  .ev-name{font-size:13px;padding-bottom:2px;margin-bottom:2px}
  .ev-name span{font-size:10.5px}
  .ev li{font-size:10.5px;line-height:1.4}
  .ev li b{font-size:10px}
  /* 1日分がA4縦1枚に収まるよう、印刷時だけ時間割を詰める */
  .banner{padding:6px 12px}.banner h2{font-size:16px}.banner span{font-size:12px}
  .colh{padding:3px 6px;font-size:12px}.colh small{font-size:10px}
  .tl{font-size:10px;padding:1px 3px}
  .tt{grid-template-columns:2.6rem minmax(0,1fr) minmax(0,1fr)}
  .blk{margin:2px;padding:3px 6px;gap:1px;break-inside:avoid}
  .blk .bt{font-size:10px}
  .blk .bh{font-size:11.5px;padding:1px 4px}
  .blk .bs,.blk .bo{font-size:9.5px;line-height:1.3}
  .blk .bn{gap:3px;padding-top:1px}
  .blk .chip{font-size:11.5px;padding:0 7px}
  .blk .cm{font-size:9.5px}
  .blk .pill{font-size:10px;padding:0 7px}
  .banner,.blk,.chip,.pill,.mylist{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="head-in">
      <div class="top">
        <div class="brand">
          <h1>第1・第2会場 運営スタッフ担当ボード</h1>
          <p>岡山コンベンションセンター ／ 11月20日(金)〜22日(日)</p>
        </div>
        <div class="me">
          <label for="nameInput">あなたの名前</label>
          <input id="nameInput" type="text" maxlength="20" placeholder="例：山田" autocomplete="off">
          <button id="nameSave" type="button">決定</button>
        </div>
      </div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">接続中…</span></div>
      <div class="adminbar" id="adminBar" hidden>管理者モード<button id="adminExit" type="button">終了</button></div>
      <nav id="tabs" aria-label="日程"></nav>
    </div>
  </header>
  <main id="app"></main>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

  async function setMine(pid,on){
    if(!myName){toast("先に名前を入力して「決定」を押してください");$in.focus();return}
    if(!db){toast("共有データに接続できていません");return}
    if(pending[pid]) return;
    pending[pid]=1;render();
    try{
      var ref=db.doc("signups/"+docId(pid,myName));
      if(on) await ref.set({p:pid,name:myName,t:Date.now()});
      else await ref.delete();
    }catch(e){toast(errMsg(e))}
    delete pending[pid];render();
  }

  async function saveComment(pid){
    if(!db||!myName||pending["c"+pid]) return;
    var my=(byProg()[pid]||[]).filter(isMine)[0];
    if(!my){toast("先に「対応できる」を押してください");return}
    var text=(drafts.hasOwnProperty(pid)?drafts[pid]:my.c).replace(/\s+/g," ").trim().slice(0,80);
    pending["c"+pid]=1;render();
    try{
      await db.doc("signups/"+docId(pid,myName)).set({p:pid,name:myName,t:my.t||Date.now(),c:text});
      delete drafts[pid];toast(text?"コメントを保存しました":"コメントを削除しました");
    }catch(e){toast(errMsg(e))}
    delete pending["c"+pid];render();
  }

  function findEntry(id){return entries.filter(function(en){return en.id===id})[0]}

  function startEdit(id){
    var en=findEntry(id);if(!en) return;
    editing=id;edDraft={name:en.name,c:en.c};render();
    var el=document.getElementById("ed-name");if(el) el.focus();
  }
  function saveEdit(id){
    var en=findEntry(id);if(!en){editing=null;render();return}
    var nn=normName(edDraft.name), c=edDraft.c.replace(/\s+/g," ").trim().slice(0,80);
    if(!nn){toast("名前を入力してください");return}
    var nid=docId(en.p,nn), old=(byAssign()[en.p]||[]).filter(function(x){return sameName(x.name,en.name)})[0];
    adminRun(async function(){
      await db.doc("signups/"+nid).set({p:en.p,name:nn,t:en.t,c:c});
      if(nid!==en.id) await db.doc("signups/"+en.id).delete();
      // 決定版に入っている人の名前を直した場合は、決定版の名前も合わせる
      if(old&&!sameName(old.name,nn)){
        await db.doc("assignments/"+docId(en.p,nn)).set({p:en.p,name:nn,t:old.t});
        await db.doc("assignments/"+old.id).delete();
      }
      editing=null;
    },"回答を修正しました");
  }
  function deleteEntry(id){
    var en=findEntry(id);if(!en) return;
    var q=BYID[en.p];
    if(!confirm("「"+en.name+"」さんの回答を削除しますか？\n"+(q?progLabel(q):"")+"\n\n（決定版の担当には影響しません）")) return;
    adminRun(function(){return db.doc("signups/"+id).delete()},"回答を削除しました");
  }
  function assign(pid,name){
    var n=normName(name);
    if(!n){toast("名前を入力してください");return}
    if((byAssign()[pid]||[]).some(function(x){return sameName(x.name,n)})){toast("「"+n+"」さんはすでに決定版に入っています");return}
    adminRun(async function(){await db.doc("assignments/"+docId(pid,n)).set({p:pid,name:n,t:Date.now()});delete addDrafts[pid]});
  }
  function unassign(id){adminRun(function(){return db.doc("assignments/"+id).delete()})}
  function togglePick(pid,name){
    var cur=(byAssign()[pid]||[]).filter(function(x){return sameName(x.name,name)})[0];
    if(cur) unassign(cur.id); else assign(pid,name);
  }
  function setPublished(v){
    if(v&&!confirm("決定版をスタッフ全員に公開しますか？")) return;
    adminRun(function(){return db.doc("settings/published").set({value:v?"true":"false"})},v?"決定版を公開しました":"決定版を非公開に戻しました");
  }

  async function sha256(s){
    var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("");
  }
  // ?admin=合言葉 で開くと管理者モード。合言葉はこの端末に記憶し、URLからは消す
  async function checkAdmin(){
    var q=null, saved="";
    try{q=new URLSearchParams(location.search).get("admin")}catch(e){}
    try{saved=localStorage.getItem("staffBoardAdmin")||""}catch(e){}
    var key=q||saved;if(!key) return;
    if(q!==null) history.replaceState(null,"",location.pathname+location.hash);
    var ok=false;try{ok=(await sha256(key))===ADMIN_HASH}catch(e){}
    if(ok){isAdmin=true;try{localStorage.setItem("staffBoardAdmin",key)}catch(e){};if(q) toast("管理者モードで開きました")}
    else{try{localStorage.removeItem("staffBoardAdmin")}catch(e){};if(q) toast("管理者の合言葉が違います")}
    render();
  }
  document.getElementById("adminExit").addEventListener("click",function(){
    if(!confirm("管理者モードを終了しますか？\nもう一度使うときは、合言葉付きのURLで開き直してください。")) return;
    try{localStorage.removeItem("staffBoardAdmin")}catch(e){}
    isAdmin=false;editing=null;render();toast("管理者モードを終了しました");
  });

  $app.addEventListener("input",function(ev){
    var t=ev.target;if(!t||!t.getAttribute) return;
    if(t.getAttribute("data-cm")) drafts[t.getAttribute("data-cm")]=t.value;
    else if(t.getAttribute("data-ed")) edDraft[t.getAttribute("data-ed")]=t.value;
    else if(t.getAttribute("data-add")) addDrafts[t.getAttribute("data-add")]=t.value;
  });
  $app.addEventListener("keydown",function(ev){
    var t=ev.target;if(ev.key!=="Enter"||!t||!t.getAttribute) return;
    if(t.getAttribute("data-cm")){ev.preventDefault();saveComment(t.getAttribute("data-cm"))}
    else if(t.getAttribute("data-ed")){ev.preventDefault();saveEdit(editing)}
    else if(t.getAttribute("data-add")){ev.preventDefault();var ap=t.getAttribute("data-add");assign(ap,addDrafts[ap]||"")}
  });
  $app.addEventListener("click",function(ev){
    var b=ev.target.closest("button[data-act]");if(!b) return;
    var pid=b.getAttribute("data-p"),act=b.getAttribute("data-act"),id=b.getAttribute("data-id");
    if(act==="savecm") saveComment(pid);
    else if(act==="remove") setMine(pid,false);
    else if(act==="pick") togglePick(pid,b.getAttribute("data-name"));
    else if(act==="edit") startEdit(id);
    else if(act==="edcancel"){editing=null;render()}
    else if(act==="edsave") saveEdit(id);
    else if(act==="del") deleteEntry(id);
    else if(act==="add") assign(pid,addDrafts[pid]||"");
    else if(act==="unassign") unassign(id);
    else if(act==="publish") setPublished(b.getAttribute("data-v")==="true");
    else if(act==="print") window.print();
    else{
      var m=byProg(),mine=(m[pid]||[]).some(isMine);
      if(mine) delete drafts[pid];
      setMine(pid,!mine);
    }
  });

  // Supabase の Project URL と anon（publishable）key。service_role key は絶対に入れないこと
  var SUPABASE_URL="https://kpefbnnquaeosgjycsci.supabase.co"; // 例: https://xxxxxxxxxxxx.supabase.co
  var SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwZWZibm5xdWFlb3Nnanljc2NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNDcyNTIsImV4cCI6MjA5MzcyMzI1Mn0.J7OwC-Y5eOjwS3FkSF-5EMMhpik5khRFMzppR5ImkuE";
  // 共有プロジェクト内のこのシステム専用スキーマ。テーブル: signups=スタッフの回答 / assignments=決定版 / settings=公開設定
  var SCHEMA="staff_board";
  async function start(){
    if(!/^https:\/\/[^ ]+$/.test(SUPABASE_URL)||/^PASTE_/.test(SUPABASE_KEY)){setStatus("bad","データベースが未設定です");render();return}
    var base=SUPABASE_URL.replace(/\/+$/,"")+"/rest/v1/", last="";
    var hdr={"apikey":SUPABASE_KEY,"Content-Type":"application/json","Accept-Profile":SCHEMA,"Content-Profile":SCHEMA};
    if(/^eyJ/.test(SUPABASE_KEY)) hdr.Authorization="Bearer "+SUPABASE_KEY; // 旧形式（JWT）の anon key
    async function call(method,table,query,body,prefer){
      var h=Object.assign({},hdr);if(prefer) h.Prefer=prefer;
      var r=await fetch(base+table+query,{method:method,headers:h,cache:"no-store",body:body===undefined?undefined:JSON.stringify(body)});
      if(!r.ok){var e=new Error("http "+r.status);e.code=(r.status===401||r.status===403||r.status===400)?"invalid_argument":"unavailable";throw e}
      var txt=await r.text(); // return=minimal の応答は本文が空
      return txt?JSON.parse(txt):null;
    }
    async function poll(){
      try{
        var res=await Promise.all([
          call("GET","signups","?select=id,p,name,t,c&order=t.asc"),
          call("GET","assignments","?select=id,p,name,t,c&order=t.asc"),
          call("GET","settings","?select=key,value")
        ]);
        var str=JSON.stringify(res);
        loaded=true;setStatus("live","共有中・数秒ごとに自動更新");
        if(str===last) return;
        last=str;
        function rows(list){return (list||[]).map(function(x){return {id:x.id,p:x.p,name:String(x.name||""),t:+x.t||0,c:String(x.c||"")}}).filter(function(x){return x.p&&x.name})}
        entries=rows(res[0]);assigns=rows(res[1]);
        published=(res[2]||[]).some(function(s){return s.key==="published"&&s.value==="true"});
        if(editing&&!findEntry(editing)) editing=null;
        render();
      }catch(e){setStatus("bad","共有データを読み込めません")}
    }
    // path は "テーブル名/キー"。settings だけ主キーが key 列
    db={doc:function(path){var i=path.indexOf("/"),tb=path.slice(0,i),id=path.slice(i+1),pk=tb==="settings"?"key":"id";return {
      set:function(d){
        var row=tb==="settings"?{key:id,value:String(d.value)}:{id:id,p:d.p,name:d.name,t:d.t,c:d.c||""};
        return call("POST",tb,"?on_conflict="+pk,row,"resolution=merge-duplicates,return=minimal").then(poll);
      },
      delete:function(){return call("DELETE",tb,"?"+pk+"=eq."+encodeURIComponent(id),undefined,"return=minimal").then(poll)}
    }}};
    setStatus("","接続中…");
    setTimeout(function(){if(!loaded) setStatus("bad","読み込みに時間がかかっています")},10000);
    await poll();
    setInterval(function(){if(!document.hidden) poll()},4000);
  }

  route();
  checkAdmin();
  start();
})();
</script>
